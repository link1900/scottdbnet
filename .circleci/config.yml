version: 2.1
orbs:
  node: circleci/node@5.1.1
  aws-cli: circleci/aws-cli@4.1.2
executors:
  default:
    docker:
      - image: cimg/node:20.10.0

commands:
  client_install_cmd:
    steps:
      - node/install-packages:
          app-dir: ~/project

  server_install_cmd:
    steps:
      - node/install-packages:
          app-dir: ~/project/server

  cdk_install_cmd:
    steps:
      - node/install-packages:
          app-dir: ~/project/cdk

  test_cmd:
    steps:
      - run:
          command: npm run test

  setup_cmd:
    steps:
      - checkout
      - aws-cli/install
      - cdk_install_cmd
      - server_install_cmd
      - client_install_cmd

  test_server:
    steps:
      - run:
          command: npm run test:ci
          working_directory: ~/project/server

  deploy_cmd:
    steps:
      - run:
          command: ./scripts/build.sh
          working_directory: ~/project/server
      - run:
          command: npm run build
          working_directory: ~/project
      - run:
          command: npm run build
          working_directory: ~/project/cdk
      - run:
          command: npm run deploy
          working_directory: ~/project/cdk

  build_cmd:
    steps:
      - run:
          command: ./scripts/build.sh
          working_directory: ~/project/server
      - run:
          command: npm run build
          working_directory: ~/project
      - run:
          command: npm run build
          working_directory: ~/project/cdk

jobs:
  test:
    executor: default
    steps:
      - setup_cmd
      - test_server
      - test_cmd
  test-and-deploy:
    executor: default
    steps:
      - setup_cmd
      - test_server
      - test_cmd
      - deploy_cmd
  just-build:
    executor: default
    steps:
      - setup_cmd
      - build_cmd

workflows:
  build:
    jobs:
      - test:
          filters:
            branches:
              ignore: master
      - test-and-deploy:
          context:
            - scottdb
          filters:
            branches:
              only: master
      - just-build:
          context:
            - scottdb
          filters:
            branches:
              only:
                fix-build
